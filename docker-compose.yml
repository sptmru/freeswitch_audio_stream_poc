services:
  vosk-server:
    image: alphacep/kaldi-en:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    network_mode: "host"
  tcp-receiver:
    build:
      context: ./tcp-receiver
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: "host"
    environment:
      - TCP_RECEIVER_PORT=0.0.0.0
      - TCP_RECEIVER_PORT=6000
  esl-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FS_HOST=freeswitch
      - ENDPOINT=ws://host.docker.internal:2700
      - NUMBER_TO_DIAL=99999
    depends_on:
      - vosk-server
      - freeswitch
  freeswitch:
    build:
      context: ./freeswitch
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8021:8021"
      - "16384-16482:16384-16482/udp"
    environment:
      - EXTENSION_PASSWORD=extensionpassword
      - NUMBER_TO_DIAL=99999

